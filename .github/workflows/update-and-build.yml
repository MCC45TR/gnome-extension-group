name: Update extension sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-extension-sources-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libglib2.0-dev-bin libxml2-utils zip unzip
      - name: Rebuild deterministic source payloads
        run: ./tools/update-sources.sh
      - name: Version changed payloads
        run: |
          if git diff --quiet -- sources sources.lock; then
            echo 'Payloads are unchanged.'
            exit 0
          fi
          current=$(sed -nE 's/^Release:[[:space:]]+([0-9]+).*/\1/p' gnome-extension-group.spec)
          test -n "$current"
          next=$((current + 1))
          sed -i -E "s/^Release:[[:space:]]+[0-9]+/Release:        $next/" \
            gnome-extension-group.spec
          stamp=$(LC_ALL=C date -u '+%a %b %d %Y')
          sed -i "/^%changelog$/a\\* $stamp mcc45tr <mcc45tr@gmail.com> - 1.0.0-$next\\n- Rebuild synchronized extension payloads\\n" \
            gnome-extension-group.spec
      - name: Validate RPM source package
        run: |
          sudo apt-get install -y rpm
          rpmbuild -bs gnome-extension-group.spec \
            --define "_sourcedir $PWD/sources" \
            --define "_srcrpmdir $PWD"
      - name: Publish changed payloads
        run: |
          if git diff --quiet -- sources sources.lock; then
            echo 'No upstream source changes.'
            exit 0
          fi
          git config user.name 'gnome-extension-group automation'
          git config user.email 'mcc45tr@gmail.com'
          git add gnome-extension-group.spec sources sources.lock
          git commit -m 'Update packaged extension sources'
          git push
